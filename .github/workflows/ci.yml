name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The long fuzz run (see the fuzz job).
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path crates/fuzz/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  # The client crate for apps: the web package (wasm-bindgen, with a smoke test in Node), the
  # Android libraries with the Kotlin bindings, and an XCFramework with the Swift bindings
  # (build/client.sh). Not a required check.
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: wasm
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: client-${{ matrix.platform }}
      - name: The version of wasm-bindgen in Cargo.lock
        if: matrix.platform == 'wasm'
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: matrix.platform == 'wasm'
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" != ios ]; then
            # ring has C code: the clang of the NDK compiles it for wasm32 too.
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_wasm32_unknown_unknown="$bin/clang" AR_wasm32_unknown_unknown="$bin/llvm-ar"
          fi
          if [ "$PLATFORM" = wasm ]; then
            rustup target add wasm32-unknown-unknown
            cargo clippy -p client --target wasm32-unknown-unknown --locked -- -D warnings
          fi
          build/client.sh "$PLATFORM" dist "${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv-1.88
      # The enclave crate needs Rust 1.92 (aws-nitro-enclaves-nsm-api); its image is built with
      # rust-toolchain.toml.
      - run: cargo +1.88 test --workspace --exclude enclave --locked

  fuzz:
    runs-on: ubuntu-latest
    # Seconds per target: 10 on a pull request, 60 on main, 300 in the daily run. With 28
    # targets that is about 5, 28 and 140 minutes plus the build.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || github.event_name == 'push' && 75 || 30 }}
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 300 || github.event_name == 'push' && 60 || 10 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/fuzz -> target
          key: fuzz-nightly
      - name: Run each fuzz target for FUZZ_SECONDS
        working-directory: crates/fuzz
        run: |
          cargo +nightly fuzz build --fuzz-dir . --target x86_64-unknown-linux-gnu
          # Real attestation documents seed the parser target.
          mkdir -p corpus/attestation
          cp ../attest/tests/fixtures/*.cbor corpus/attestation/
          for target in $(cargo +nightly fuzz list --fuzz-dir .); do
            echo "::group::$target"
            cargo +nightly fuzz run --fuzz-dir . --target x86_64-unknown-linux-gnu "$target" -- -max_total_time="$FUZZ_SECONDS"
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/fuzz/artifacts
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny --config .github/deny.toml check

  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: first
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: second
      - name: Build the credentials binary (with its verifier) twice in different directories and compare
        run: |
          for dir in first second; do
            (
              cd "$dir"
              export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
              cargo build --release --locked -p cli
            )
          done
          sha256sum first/target/release/credentials second/target/release/credentials
          cmp first/target/release/credentials second/target/release/credentials
