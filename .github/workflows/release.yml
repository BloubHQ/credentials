name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        # The same path remapping as the reproducible-build check in ci.yml.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          cargo build --release --locked -p cli --target "${{ matrix.target }}"
      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          # One binary: the log verifier ships inside it as `credentials verify`.
          cp "target/$TARGET/release/credentials$EXT" "dist/credentials-$GITHUB_REF_NAME-$TARGET$EXT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The enclave image file, built twice (the second time without any cache); the job fails
  # unless PCR0, PCR1 and PCR2 are the same. measurements.json names the release, the commit,
  # the PCRs and the digest of every input.
  enclave:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the enclave image file twice and compare
        run: build/reproduce.sh --release "$GITHUB_REF_NAME" --out out
      - name: The measurements name the pushed tag and its commit
        run: |
          test "$(jq -er .release out/measurements.json)" = "$GITHUB_REF_NAME"
          test "$(jq -er .git_commit out/measurements.json)" = "$GITHUB_SHA"
          cat out/measurements.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enclave
          path: |
            out/enclave.eif
            out/measurements.json
          if-no-files-found: error

  # The packages of the client crate (build/client.sh): client-wasm-<tag>.tgz,
  # client-android-<tag>.zip and client-ios-<tag>.xcframework.zip.
  client:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: wasm
            os: ubuntu-latest
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The version of wasm-bindgen in Cargo.lock
        if: matrix.platform == 'wasm'
        id: wasm-bindgen
        run: echo "version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        if: matrix.platform == 'wasm'
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" != ios ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
            bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            export CC_wasm32_unknown_unknown="$bin/clang" AR_wasm32_unknown_unknown="$bin/llvm-ar"
          fi
          build/client.sh "$PLATFORM" dist "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, enclave, client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enclave
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: client-*
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx
      # One SBOM per shipped program, each with its whole dependency tree. cargo-cyclonedx
      # writes <package>/<package>.cdx.json for every workspace member; only the packages of
      # the shipped programs are kept: `cli` (the `credentials` binary, built for Linux, macOS
      # and Windows, so every target's dependencies), `client` (the one library in the web,
      # Android and iOS packages, so every target's dependencies too: UniFFI on Android and
      # iOS, wasm-bindgen on the web) and `enclave` (the program in enclave.eif, built for
      # x86_64-unknown-linux-musl).
      - name: Generate the SBOMs
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --target all
          cp crates/cli/cli.cdx.json "dist/credentials-$GITHUB_REF_NAME.cdx.json"
          cp crates/client/client.cdx.json "dist/client-$GITHUB_REF_NAME.cdx.json"
          cargo cyclonedx --format json --spec-version 1.5 --target x86_64-unknown-linux-musl
          cp crates/enclave/enclave.cdx.json "dist/enclave-$GITHUB_REF_NAME.cdx.json"
          ls dist/*.cdx.json
          test "$(find dist -name '*.cdx.json' | wc -l)" -eq 3
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-rc.1) is a prerelease and never "Latest".
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          # The notes start with the measurements of the enclave image file; the generated
          # notes follow them.
          {
            echo "## Enclave measurements"
            echo
            echo 'PCR0, PCR1 and PCR2 of `enclave.eif`. Build it again with `build/reproduce.sh` at this tag to check them.'
            echo
            echo '```json'
            cat dist/measurements.json
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
