name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        # The same path remapping as the reproducible-build check in ci.yml.
        run: |
          export RUSTFLAGS="--remap-path-prefix=$PWD=/src --remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup"
          cargo build --release --locked -p cli --target "${{ matrix.target }}"
      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          # One binary: the log verifier ships inside it as `credentials verify`.
          cp "target/$TARGET/release/credentials$EXT" "dist/credentials-$GITHUB_REF_NAME-$TARGET$EXT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The enclave image file, built twice (the second time without any cache); the job fails
  # unless PCR0, PCR1 and PCR2 are the same. measurements.json names the release, the commit,
  # the PCRs and the digest of every input.
  enclave:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the enclave image file twice and compare
        run: build/reproduce.sh --release "$GITHUB_REF_NAME" --out out
      - name: The measurements name the pushed tag and its commit
        run: |
          test "$(jq -er .release out/measurements.json)" = "$GITHUB_REF_NAME"
          test "$(jq -er .git_commit out/measurements.json)" = "$GITHUB_SHA"
          cat out/measurements.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enclave
          path: |
            out/enclave.eif
            out/measurements.json
          if-no-files-found: error

  release:
    needs: [build, enclave]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: enclave
          path: dist
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-cyclonedx
      - name: Generate the SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5
          for sbom in $(find crates -name '*.cdx.json'); do
            cp "$sbom" "dist/$(basename "$sbom" .cdx.json)-$GITHUB_REF_NAME.cdx.json"
          done
          ls dist/*.cdx.json
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-rc.1) is a prerelease and never "Latest".
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          # The notes start with the measurements of the enclave image file; the generated
          # notes follow them.
          {
            echo "## Enclave measurements"
            echo
            echo 'PCR0, PCR1 and PCR2 of `enclave.eif`. Build it again with `build/reproduce.sh` at this tag to check them.'
            echo
            echo '```json'
            cat dist/measurements.json
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
