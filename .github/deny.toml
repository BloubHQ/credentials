[advisories]
version = 2
yanked = "deny"
ignore = [
  # serde_cbor is unmaintained. aws-nitro-enclaves-nsm-api (the AWS API of the Nitro Secure
  # Module) uses it to encode requests to /dev/nsm and decode its answers, inside the enclave.
  { id = "RUSTSEC-2021-0127", reason = "dependency of aws-nitro-enclaves-nsm-api; NSM messages only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  # UniFFI (the Swift and Kotlin bindings of the client crate): file-level copyleft; used
  # unmodified, so nothing of ours falls under it.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  # foldhash (hashing in the boa engine module and in the host tree).
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
