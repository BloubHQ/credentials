name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste real credentials. Security issues go to Security, Report a vulnerability."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A policy, a request or a failing test, with secrets replaced.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version, Rust version, OS
