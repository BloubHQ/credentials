[workspace]
resolver = "3"
members = ["crates/engine", "crates/verify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["alloc"] }
k256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
md-5 = "0.10"
pbkdf2 = "0.12"
ring = "0.17"
sha3 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize", "pkcs8", "pem"] }
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"
