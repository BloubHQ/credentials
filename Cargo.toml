[workspace]
resolver = "3"
members = ["crates/attest", "crates/cli", "crates/enclave", "crates/engine", "crates/server", "crates/transport", "crates/verify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
publish = false
repository = "https://github.com/BloubHQ/credentials"

[workspace.dependencies]
attest = { path = "crates/attest" }
engine = { path = "crates/engine" }
transport = { path = "crates/transport" }
server = { path = "crates/server" }
aes = "0.8"
aes-gcm = "0.10"
cbc = { version = "0.2", features = ["alloc"] }
k256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
md-5 = "0.10"
pbkdf2 = "0.12"
ring = "0.17"
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
sha3 = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize", "pkcs8", "pem"] }
hkdf = "0.12"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
hmac = "0.12"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
memchr = "2"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
# Attestation documents: CBOR, and the X.509 chain of the Nitro Secure Module.
ciborium = { version = "0.2", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
panic = "unwind"

# Dependencies (crypto) optimized in debug builds: tests make many signatures.
[profile.dev.package."*"]
opt-level = 2

# The engine itself, lightly: one test makes 100,000 signed calls.
[profile.dev.package.engine]
opt-level = 1
