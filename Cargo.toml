[workspace]
resolver = "3"
# Fuzz targets need a nightly compiler; they are a workspace of their own. The JavaScript
# engine module is built only for wasm32-unknown-unknown (build/js-module.sh).
exclude = ["crates/fuzz", "crates/sandbox/js"]
members = [
    "crates/attest",
    "crates/cli",
    "crates/client",
    "crates/continuity",
    "crates/enclave",
    "crates/engine",
    "crates/host",
    "crates/relay",
    "crates/sandbox",
    "crates/server",
    "crates/transport",
    "crates/verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false
repository = "https://github.com/BloubHQ/credentials"

[workspace.dependencies]
attest = { path = "crates/attest" }
continuity = { path = "crates/continuity" }
engine = { path = "crates/engine" }
transport = { path = "crates/transport" }
server = { path = "crates/server" }
relay = { path = "crates/relay" }
host = { path = "crates/host" }
sandbox = { path = "crates/sandbox" }
aes = "0.9.2"
aes-gcm = "0.11"
# AES modes and MACs (RustCrypto, cipher 0.5 generation): key wrap (RFC 3394, RFC 5649),
# CMAC (RFC 4493), EAX, ciphertext stealing (RFC 3962 uses CBC-CS3).
aes-kw = "0.3.1"
cmac = "0.8"
eax = "0.6.1"
cts = "0.7"
ccm = "0.6.1"
cbc = { version = "0.2.1", features = ["alloc"] }
k256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
md-5 = "0.11"
md4 = "0.11"
pbkdf2 = "0.13"
ring = "0.17"
p384 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
p521 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
x25519-dalek = "3"
# RSA encryption (OAEP, PKCS#1 v1.5) and PKCS#1 v1.5 signatures with SHA-1, which ring lacks.
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "getrandom", "pkcs1v15"] }
# SRP-6a: constant-time big integers (Montgomery form, fixed-window exponentiation); already
# a dependency of `rsa`, so no new code is pulled in.
crypto-bigint = { version = "0.7.11", default-features = false, features = ["alloc", "zeroize"] }
# Tests only: an independent big-integer library for the SRP server and verifier, and a
# safe-prime check of the RFC 5054 groups (both already in Cargo.lock).
num-bigint = "0.4.8"
crypto-primes = { version = "0.7.2", default-features = false, features = ["alloc"] }
# Captures: linear-time regular expressions over bytes, no Unicode tables.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
# Captures: a WHATWG HTML tokenizer with no dependencies and no unsafe code.
html5gum = "0.9"
# DEFLATE, zlib and gzip (RFC 1951, 1950, 1952): pure Rust, no unsafe code (`forbid`).
miniz_oxide = "0.9.1"
# XML canonicalization: a tokenizer that keeps prefixes as written; no unsafe code
# (`forbid`), no default features (no encodings but UTF-8, no serde).
quick-xml = { version = "0.42", default-features = false }
sha3 = "0.12"
# SHAKE128 and SHAKE256 (FIPS 202); sha3 0.12 moved them into this crate.
shake = "0.1"
# TurboSHAKE (Keccak-p[1600, 12]) and KangarooTwelve, RFC 9861.
keccak = "0.2"
k12 = { version = "0.5.1", default-features = false, features = ["zeroize"] }
# Brainpool P256r1 and P384r1 ECDSA (RFC 5639; COSE ESB256, ESB384), the RustCrypto
# generation of p256 0.14.
bp256 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic", "pkcs8", "sha256"] }
bp384 = { version = "0.14", default-features = false, features = ["ecdsa", "arithmetic", "pkcs8", "sha384"] }
ecdsa = { version = "0.17", default-features = false, features = ["algorithm", "pkcs8"] }
# ML-DSA (FIPS 204): JOSE, COSE and TLS post-quantum signatures.
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc", "zeroize"] }
# SM2 signatures with SM3 (GB/T 32918, RFC 8998).
sm2 = { version = "0.14", default-features = false, features = ["dsa", "pkcs8"] }
# Ed448 and X448. Pre-releases: the only maintained RustCrypto crates for curve448, pinned.
ed448-goldilocks = { version = "=0.14.0-pre.15", default-features = false, features = ["signing", "pkcs8", "alloc"] }
x448 = { version = "=0.14.0-pre.12", default-features = false }
# DSA (FIPS 186-4), deterministic nonces (RFC 6979). Signing sits behind the crate's `hazmat`
# feature since FIPS 186-5 withdrew DSA signature generation; legacy protocols still ask for it.
dsa = { version = "0.7", features = ["hazmat"] }
base64 = "0.22"
chacha20poly1305 = "0.11"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize", "pkcs8", "pem"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Where in a JSON document a field fails (CLI messages).
serde_path_to_error = "0.1"
memchr = "2"
sha1 = { version = "0.11", features = ["oid"] }
sha2 = "0.11"
thiserror = "2"
# Attestation documents: CBOR, and the X.509 chain of the Nitro Secure Module.
ciborium = { version = "0.2", default-features = false, features = ["std"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
zeroize = { version = "1", features = ["derive"] }
# Device transfer: SPAKE2 (RFC 9382) of RustCrypto, the PAKE crate of the current
# generation (curve25519-dalek 5, sha2 0.11, hkdf 0.13). A pre-release: pinned.
spake2 = { version = "=0.5.0-pre.0", default-features = false }
# Test-only certificates (test Nitro and Sigstore roots, generated at run time).
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
time = { version = "0.3", default-features = false }
# The bindings of the client crate: Swift and Kotlin (UniFFI), JavaScript (wasm-bindgen).
uniffi = { version = "0.32", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
# The trusted code sandbox (layer 3): an interpreter, no code generated at run time; no
# memory64 or SIMD. The 1.x line, not 2.0: wasmi 2.0.3 crashed (access violation) when built
# at a higher optimisation level than the crate embedding it (`docs/sandbox.md`).
wasmi = { version = "1.1.0", default-features = false, features = ["std"] }
# WebAssembly text, for the tests of the sandbox and its reviewed library modules.
wat = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = true
# Unwind, not abort: a panic in one connection (the DTLS transport runs under
# `catch_unwind`) ends only that connection; a panic with the node state locked halts the
# node (`engine::Error::StateLost`).
panic = "unwind"
# Integer overflow panics in release as in debug builds, instead of wrapping silently.
overflow-checks = true

# Dependencies (crypto) optimized in debug builds: tests make many signatures.
[profile.dev.package."*"]
opt-level = 2

# The engine itself, lightly: one test makes 100,000 signed calls.
[profile.dev.package.engine]
opt-level = 1
