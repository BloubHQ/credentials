[package]
name = "engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Not a member of the main workspace: it needs a nightly compiler and libFuzzer.
[workspace]

[dependencies]
engine = { path = "../crates/engine" }
libfuzzer-sys = "0.4"
serde_json = "1"

[[bin]]
name = "template_parse"
path = "fuzz_targets/template_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_json"
path = "fuzz_targets/policy_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "log_entry"
path = "fuzz_targets/log_entry.rs"
test = false
doc = false
bench = false
