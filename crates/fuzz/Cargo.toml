[package]
name = "engine-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Not a member of the main workspace: it needs a nightly compiler and libFuzzer.
[workspace]

[dependencies]
attest = { path = "../attest" }
engine = { path = "../engine" }
continuity = { path = "../continuity" }
client = { path = "../client" }
sandbox = { path = "../sandbox" }
transport = { path = "../transport" }
relay = { path = "../relay" }
libfuzzer-sys = "0.4"
serde_json = "1"
zeroize = "1"

[[bin]]
name = "template_parse"
path = "fuzz_targets/template_parse.rs"
test = false
doc = false
bench = false

