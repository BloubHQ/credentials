[package]
name = "enclave"
description = "A credentials node inside an AWS Nitro Enclave: NSM attestation, vsock HTTP, egress and log through the parent instance."
version.workspace = true
edition.workspace = true
# aws-nitro-enclaves-nsm-api needs 1.92; the enclave image is built with rust-toolchain.toml.
rust-version = "1.92"
license.workspace = true
publish.workspace = true
readme = "../../README.md"
repository.workspace = true

[[bin]]
name = "enclave"
path = "src/main.rs"

[dependencies]
engine.workspace = true
server.workspace = true
transport.workspace = true
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroizing-alloc = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = { version = "0.5", default-features = false, features = ["nix"] }

[lints]
workspace = true
