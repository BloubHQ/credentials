[package]
name = "transport"
description = "TLS transport for the credentials engine: rustls with the ring provider, Mozilla roots, client certificates, size and time limits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "../../README.md"
repository.workspace = true

[dependencies]
engine.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# DTLS 1.2 and 1.3 (`dtls`): a Sans-IO state machine, no unsafe code (`forbid`), built without
# its crypto backends; `transport::dtls` gives it ring, rustls-webpki and `aes`.
dimpl = { version = "0.8", default-features = false }
ring.workspace = true
webpki.workspace = true
# The record number mask of the DTLS 1.3 AES suites (AES-ECB of one block).
aes.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The DTLS tests: certificates made at run time.
rcgen.workspace = true
zeroizing-alloc = "0.1"

[lints]
workspace = true
