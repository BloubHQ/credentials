[package]
name = "js-module"
description = "The reviewed JavaScript library module of the credentials sandbox: the boa engine compiled to WebAssembly, run by the sandbox like any module."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# Not a member of the main workspace: it is built only for wasm32-unknown-unknown, by
# build/js-module.sh, and its output is checked in as crates/sandbox/libraries/js.wasm.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# No default features: no float16 or xsum, no Intl, no `js` (wasm-bindgen) feature.
boa_engine = { version = "=0.21.1", default-features = false }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
